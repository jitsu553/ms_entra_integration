[project]
name = "ms-entra-integration"
version = "0.1.0"
description = "FastAPI service for reading/sending mail via Microsoft Graph (app-only auth)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "msal>=1.31",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]  # FastAPI's Depends()-in-default is the idiomatic pattern
